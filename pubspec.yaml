name: file_launcher
description: Open local files with native viewers on iOS and Android, with a share-sheet fallback and no storage permissions.
version: 0.1.0
topics: [file, open-file, viewer, pdf, quick-look]
screenshots:
  - description: Flutter example gallery with categorized local-file samples.
    path: doc/assets/example-gallery.png
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.rishithamenusha.file_launcher
        pluginClass: FileLauncherPlugin
      ios:
        pluginClass: FileLauncherPlugin
