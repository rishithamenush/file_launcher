name: file_launcher
description: Open local files or in-memory bytes with native viewers on iOS, Android, macOS, Windows and Linux, with a share-sheet fallback and no storage permissions.
version: 0.2.0
repository: https://github.com/rishithamenush/file_launcher
issue_tracker: https://github.com/rishithamenush/file_launcher/issues
topics: [file, open-file, viewer, share, quick-look]
screenshots:
  - description: Flutter example gallery with categorized local-file samples.
    path: doc/assets/example-gallery.png
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  plugin_platform_interface: ^2.1.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.rishithamenusha.file_launcher
        pluginClass: FileLauncherPlugin
      ios:
        pluginClass: FileLauncherPlugin
      macos:
        pluginClass: FileLauncherPlugin
      windows:
        dartPluginClass: FileLauncherDesktop
      linux:
        dartPluginClass: FileLauncherDesktop
