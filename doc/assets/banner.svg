      <text x="40" y="21" font-size="21" fill="#252623">Images</text>
      <text x="40" y="44" font-family="Menlo, monospace" font-size="12" fill="#75766e">JPG · PNG · HEIC</text>
    </g>
    <g transform="translate(0 135)">
