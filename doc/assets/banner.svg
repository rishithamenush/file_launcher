      <text x="40" y="21" font-size="21" fill="#252623">Audio</text>
      <text x="40" y="44" font-family="Menlo, monospace" font-size="12" fill="#75766e">MP3 · WAV · FLAC</text>
    </g>
    <g transform="translate(287 135)">
      <path d="M2 4h16l8 8v27H2zM18 4v8h8" fill="none" stroke="#92958a" stroke-width="1.3"/>
      <path d="M8 23h12M8 28h8" stroke="#d9512f" stroke-width="1.5"/>
      <text x="40" y="21" font-size="21" fill="#252623">Video</text>
      <text x="40" y="44" font-family="Menlo, monospace" font-size="12" fill="#75766e">MP4 · MOV · WEBM</text>
    </g>
    <g transform="translate(0 205)">
      <path d="M2 4h16l8 8v27H2zM18 4v8h8" fill="none" stroke="#92958a" stroke-width="1.3"/>
      <path d="M8 23h12M8 28h8" stroke="#d9512f" stroke-width="1.5"/>
      <text x="40" y="21" font-size="21" fill="#252623">Spreadsheets</text>
      <text x="40" y="44" font-family="Menlo, monospace" font-size="12" fill="#75766e">XLSX · XLS · ODS</text>
    </g>
    <g transform="translate(287 205)">
      <path d="M2 4h16l8 8v27H2zM18 4v8h8" fill="none" stroke="#92958a" stroke-width="1.3"/>
