      <text x="40" y="21" font-size="21" fill="#252623">Presentations</text>
      <text x="40" y="44" font-family="Menlo, monospace" font-size="12" fill="#75766e">PPTX · PPT · KEY</text>
    </g>
    <g transform="translate(0 275)">
      <path d="M2 4h16l8 8v27H2zM18 4v8h8" fill="none" stroke="#92958a" stroke-width="1.3"/>
      <path d="M8 23h12M8 28h8" stroke="#d9512f" stroke-width="1.5"/>
      <text x="40" y="21" font-size="21" fill="#252623">Archives</text>
      <text x="40" y="44" font-family="Menlo, monospace" font-size="12" fill="#75766e">ZIP · RAR · 7Z</text>
    </g>
    <g transform="translate(287 275)">
      <path d="M2 4h16l8 8v27H2zM18 4v8h8" fill="none" stroke="#92958a" stroke-width="1.3"/>
      <path d="M8 23h12M8 28h8" stroke="#d9512f" stroke-width="1.5"/>
      <text x="40" y="21" font-size="21" fill="#252623">Text &amp; data</text>
      <text x="40" y="44" font-family="Menlo, monospace" font-size="12" fill="#75766e">TXT · CSV · JSON</text>
    </g>
    <path d="M0 340H549" stroke="#252623" stroke-width="2"/>
    <text x="0" y="372" font-size="21" fill="#252623">Custom &amp; other formats, too.</text>
    <text x="0" y="400" font-size="15" fill="#62645c">Examples above, not a fixed list of accepted extensions.</text>
    <text x="0" y="428" font-size="15" fill="#62645c">No compatible viewer? Try the system share sheet.</text>
  </g>

  <path d="M64 621H1376" stroke="#cecec5"/>
  <text x="64" y="668" font-size="16" fill="#252623">No storage permission prompts.</text>
  <text x="1376" y="668" text-anchor="end" font-size="14" fill="#75766e">Format support depends on the device and installed apps.</text>
